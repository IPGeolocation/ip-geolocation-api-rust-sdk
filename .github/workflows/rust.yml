name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - name: Run offline tests
        run: cargo +${{ matrix.toolchain }} test --locked --all-targets -- --skip live_
      - name: Build release library
        run: cargo +${{ matrix.toolchain }} build --locked --release
      - name: Verify package
        run: cargo +${{ matrix.toolchain }} package --locked
